[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qorb-vault"
version = "1.0.0"
description = "The seal over QuantumOrb's closed source: commitments, inclusion proofs, the seal ledger and the interface contracts, checked."
readme = "SEAL.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "QuantumOrb" }]
dependencies = []  # standard library only: anyone can run the check
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "License :: Other/Proprietary License",
]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.18"]

[project.scripts]
qorb-vault = "vault.cli:main"

[tool.setuptools]
packages = ["vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP037", "UP045", "B904"]  # 3.9 spellings are kept on purpose

[tool.ruff.lint.per-file-ignores]
"interfaces/**" = ["E", "F", "W", "I", "UP"]
"tests/**" = ["B023"]
